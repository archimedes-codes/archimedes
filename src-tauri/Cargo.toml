[package]
name = "archimedes"
version = "0.10.0"
license = "MIT"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# A single binary (the app — the desktop is native-only, the external
# `pi` path is gone; the dev-only `fake_pi` test fixture is deleted);
# tell cargo which one `cargo run` (and thus `tauri dev`) should launch.
default-run = "archimedes"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "archimedes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
# The OS notification behind an attention alert (ADR 0038) — called from Rust
# only, so there is no capability entry and no npm package.
tauri-plugin-notification = "2"
# The on-disk state dirs (`~/.config/archimedes`, `~/.local/share/archimedes`,
# `~/Library/Application Support/archimedes`, …) — the same crate Tauri uses
# to resolve the platform base dirs, joined with a bare `archimedes` (NOT
# the bundle identifier: Tauri's own `config_dir()` / `app_data_dir()`
# append the identifier, which would give `…/codes.archimedes.desktop`).
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "io-std", "sync", "macros", "time", "net", "rt"] }
tokio-util = "0.7"
# The `exec_find` fallback when `fd` is not installed (walk the cwd tree).
walkdir = "2"
# The walker `ripgrep` is built on — a LIBRARY, statically linked, so there is
# no binary for the user to install. It decides the `?` listing's visibility:
# the repo's own ignore rules are what prune it (ADR 0034), which is a
# load-bearing semantic rather than an implementation detail, so the version
# this design was verified against is recorded here: 0.4.33.
ignore = "0.4"
# base64 for the `read` tool's image content blocks (pi's `ImageContent` =
# `{type: "image", data, mimeType}` — `data` is base64, no `data:` prefix).
base64 = "0.22"
thiserror = "2"
# The native harness's model client (native-agent-harness Task 4): an
# OpenAI-compatible chat-completions client (streaming SSE). `rustls-tls`
# (default features off) avoids a system-OpenSSL build dependency;
# `stream` provides `bytes_stream`, `json` the request body.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
# `url` (already a transitive `reqwest` dep — no new crate): parsing the
# base URL's PATH for the Anthropic-wire `/v1` normalization (ADR 0024 —
# mirroring ZCode's `normalizeAnthropicBaseURL`, which operates on the
# URL path, NOT the full string, so a query string is not corrupted).
url = "2"
# `BoxStream` (the `Provider`'s returned stream) + `StreamExt` (consuming
# it in the `AgentLoop`, Task 6) — `futures-core` alone has `BoxStream`
# but no `.next()`, so the full `futures-util` is needed.
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
# OAuth 2.1 (the native `mcp` tool's HTTP-server auth, ADR 0018): `sha2`
# (the PKCE S256 challenge) + `rand` (the PKCE verifier + the callback
# `state` entropy).
sha2 = "0.10"
rand = "0.9"
async-trait = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
# System-clipboard image read for the WebKitGTK paste fallback (Wayland
# `wl-clipboard-rs` backend when `WAYLAND_DISPLAY` is set, X11 otherwise).
arboard = { version = "3.6", features = ["wayland-data-control"] }
image = { version = "0.25", features = ["png"] }
dom_query = "0.28"
ddgs = "0.1"
ipnet = "2"
pdf-extract = "0.12"
regex = "1"
# The codemode sandbox engine (ADR 0089): an embedded QuickJS in the
# Worker. `futures` exposes AsyncRuntime/AsyncContext; `parallel` is the
# crate's (experimental) gate for the Send + Sync impls the engine needs
# to live inside tokio::spawn(loop_.run()) — decided by a compile-time
# assertion, not assumption (see codemode-task02). WITHOUT `parallel` the
# assertion does not compile — `AsyncRuntime`/`AsyncContext` are `!Send +
# !Sync`, their impls are `#[cfg(feature = "parallel")]` in the crate.
# `rust-alloc`/`allocator` must stay OFF. rquickjs documents `set_memory_limit`
# as "a Noop when a custom allocator is being used, as is the case for the
# 'rust-alloc' or 'allocator' features"
# (rquickjs-core-0.14.0/src/runtime/async.rs:204-210), and this dependency is
# pinned to the version carrying that warning.
#
# The warning is stronger than what was measured here, and both halves are
# recorded so nobody re-derives it: with `--features rquickjs/rust-alloc` on this
# exact dependency set, the limit was still REPORTED (memory_usage's
# `malloc_limit` read back 8 388 608) and still ENFORCED (an 8 MiB-capped blowup
# threw with `malloc_size` plateaued at 8 387 864) — because QuickJS's cap check
# sits in `js_malloc_rt` (quickjs.c:2017), ABOVE the `rt->mf.js_malloc` allocator
# dispatch. So the no-op is not reproducible on 0.14.0. Keep the features off
# regardless: the guarantee we are relying on is the one the crate PROMISES, and
# a future rquickjs that moves the check behind the allocator dispatch makes the
# cap vanish silently.
#
# Guards, and which one catches what — a unit test CANNOT catch the graph
# poisoning, because feature unification happens at compile time, before any
# test runs:
#   - scripts/check-rquickjs-allocator.sh (CI `scripts` job) — the BUILD GRAPH:
#     asks the resolver whether either feature got unified in from a transitive
#     dependency. That is the only party that can know.
#   - engine.rs `memory_cap_is_installed_not_merely_requested` — the cap is
#     INSTALLED (reads the limit back out of the C runtime).
#   - engine.rs `a_tiny_cap_surfaces_as_a_script_end_not_a_hang` — the cap is
#     ENFORCED (an allocation above an 8 MiB cap must end as a ScriptEnd).
rquickjs = { version = "0.14.0", features = ["futures", "parallel"] }
# (Task 4) The ATOMIC settings write (`config::write_settings_atomic`):
# `NamedTempFile` in the config dir + `persist` (rename), so a torn write can
# never destroy `settings.json`. Was a DEV-dependency (test temp dirs only);
# the production use here is why it moved to `[dependencies]` — the version is
# unchanged, so the lockfile does not re-resolve. The dev-dependency entry is
# GONE (a crate listed in both is redundant; `[dependencies]` covers tests).
tempfile = "3"

[dev-dependencies]
serde_json = "1"
# Enables `tauri::test` (mock runtime) for the headless IPC test.
tauri = { version = "2", features = ["test"] }
# Mock HTTP server for the `Provider` integration tests (canned SSE
# streams, canned status codes).
wiremock = "0.6"
# `test-util` (dev-only): the paused clock the prompt tests advance well past
# any deadline they must NOT carry — a question waits for the person, never
# for a timer.
tokio = { version = "1", features = ["test-util"] }

# `libc` is needed on ALL unix platforms: `RealSudoRunner`'s
# `#[cfg(unix)]` `setpgid`/`kill` (process-group kill) code compiles on
# every unix target.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Direct GTK dependency matches tao/wry 0.18 on Linux to access
# GdkWindowState and gtk_window on the main thread; a Tauri bump must
# check the matching tao version.
gtk = "0.18"

# The session-bus send behind a Linux attention alert (`attention::delivery`).
# Version AND default features are the plugin's own (`notify-rust = "4.18"`,
# default `z`), so feature unification keeps ONE copy of the crate in the
# graph — the target list is the plugin's own notify-rust gate verbatim:
# android/ios are `unix` but are exactly what it excludes, and so are we
# (`cfg(unix)` alone would ask notify-rust to build there).
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
notify-rust = "4.18"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# The auto-updater behind `check_update` / `install_update` / `relaunch_app`
# (ADR 0053) — registered in Rust and called from Rust, so there is no
# capability entry and no npm package, exactly like the notification plugin
# above. Target-gated to the three desktop OSes because that is the whole set
# the plugin supports (its own manifest lists no mobile support) and this app
# ships desktop-only; `tauri` itself stays pinned at the version
# `@tauri-apps/cli` is pinned to (AGENTS.md), which 2.14 respects (`tauri = "2.12"`).
tauri-plugin-updater = "2.14.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# The ADR 0025 consequence: a Worker panic stays in the Worker (the
# process dies, the app lives); the binary grows with unwind tables —
# accepted.
panic = "unwind"
strip = true
