[package]
name = "archimedes"
version = "0.13.0"
license = "MIT"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# A single binary (the app — the desktop is native-only, the external
# `pi` path is gone; the dev-only `fake_pi` test fixture is deleted);
# tell cargo which one `cargo run` (and thus `tauri dev`) should launch.
default-run = "archimedes"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "archimedes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# T5: the harness core moved out of the desktop binary (S1 = the leaf modules). The
# desktop depends on the crate (the allowed direction — the crate NEVER depends on
# `archimedes_lib`; that edge is the package cycle T5's ruling severs), and
# `agent/mod.rs` re-exports from it so consumers outside `agent/` need zero edits.
#
# T8b/S8b.4-part-3 moved the crate into its OWN repo (`archimedes-codes/fulcrum`).
# The crate has since been RENAMED `fulcrum-core` → `fulcrum-harness` (fulcrum#17,
# commit `12488ee`) and PUBLISHED to crates.io as `fulcrum-harness` 0.1.0 on
# 2026-11-08, from fulcrum commit `b52ce68`. So this is a REGISTRY VERSION PIN.
# The engine still lives in `archimedes-codes/fulcrum` and is published FROM that
# repo — it is not vendored here — and the published tree IS that repo's tree: the
# `.crate`'s `src/` is byte-identical to `b52ce68`'s `src/` (`diff -rq` clean over
# the 164 files of `src/`).
#
# ISSUE #180 F2 republished at `0.2.0` (fulcrum tag `v0.2.0`, peeling to `7f21099`
# — a POST-RENAME commit, so this tag IS pinnable where `v0.1.0` is not; the form
# below stays the registry because the arguments for it below are untouched, not
# because the tag became usable). That release is the one carrying F1's Task seam:
# `seams::TaskStore` + `TaskStoreError` + the DTOs, `TaskCall`,
# `Outbound::TaskRequest` / `Inbound::TaskResponse`, the seven task tools, and
# `ToolCtx::task_store` — a BREAKING field on a public struct, which is why this is
# a minor bump and not a patch. The desktop's `impl TaskStore for Db`
# (`storage/db.rs`) and the Supervisor's `TaskRequest` router arm
# (`agent/session/router.rs`) are what make that seam live here, and they landed in
# THIS pin's commit: the pin and the router arm are ONE commit because `route_event`
# matches `WorkerInboundEvent` exhaustively with no `_` arm, so the variant arriving
# is the match stopping to compile.
#
# PIN FORM — THE REGISTRY, WHERE THIS BLOCK USED TO ARGUE FOR TAG + VERSION. That
# form was chosen deliberately, and it is now IMPOSSIBLE rather than merely
# forgone. Measured on this very manifest, `{ git = "https://github.com/
# archimedes-codes/fulcrum", tag = "v0.1.0", version = "0.1.0" }` fails resolution
# (exit 101) with
#     error: no matching package named `fulcrum-harness` found
#     location searched: Git repository …?tag=v0.1.0
# because `v0.1.0` is an annotated tag that peels to `ae1fe97`, and
# `ae1fe97:Cargo.toml` still declares `name = "fulcrum-core"`. `v0.1.0` is simply
# UN-PINNABLE under the new name. Do NOT "explain" this by claiming the tag holds
# different ENGINE code — it does not. `ae1fe97`'s `src/` differs from the shipped
# `.crate` in 20 files / 47 lines and EVERY one of them is the name swap, so the
# engine a consumer links is identical modulo the name; the residuals are
# upstream's own `#[cfg(test)]` label literals and its historical comment
# citations of the deleted `crates/` workspace directory, neither of which
# reaches a desktop build. The pin
# moved because the tag cannot RESOLVE, not because the code differs — and a
# comment that overstates that would be the second wrong argument shipped in this
# block's name.
#
# AND A GREEN `--tag` IS NOT PROOF. Fulcrum's `162bf48` records that its own
# `check-versions.sh --tag v0.1.0` prints "versions match" and exits 0 over that
# un-installable tag: a tag whose manifest carries the right VERSION but the wrong
# NAME passes a version check and still cannot be resolved.
#
# WHY NOT `rev`. `{ git = …, rev = "b52ce68" }` DOES resolve today (measured, exit
# 0). It is still the wrong form: it pins a commit by number, which is exactly
# what this line gave up in favour of an intent-bearing source, it buys nothing
# the registry does not already give, and it keeps the desktop reading a repo
# whose crate has since published itself — so the desktop drifts from every other
# consumer of the same published artifact for no gain.
#
# THE RETURN PATH to tag + version is a NEW fulcrum tag on a POST-RENAME commit —
# at or past `12488ee` (the rename) and past `b52ce68` (the publishable tree) —
# and NEVER a re-pointing of `v0.1.0`, which is cited as history in BOTH repos and
# which the ancestry gate forbids moving.
#
# THE IMMUTABILITY STILL COMES FROM THE LOCK, NOT THE MANIFEST — only more
# strongly. `Cargo.lock` records the pinned `fulcrum-harness` version with
# `source = "registry+…"` plus a `checksum`: a git tag can be force-pushed, a
# published release and its checksum cannot. Two consequences, unchanged by the
# switch of source:
#   * a CI or release run that must reproduce this exact engine tree needs
#     `--locked` (`--locked` refuses any lock change, `--offline` also refuses a
#     fetch); the bare `cargo test` / `cargo clippy` steps in `ci.yml` are NOT
#     `--locked`, so they resolve FROM the lock but are free to re-resolve if the
#     lock stops matching this line —
#   * `fulcrum-harness = "0.2.0"` means `^0.2.0`, so a re-resolve could in
#     principle land on a future `0.2.x`. What prevents that is the lock plus the
#     checksum, and moving it is a `cargo update -p fulcrum-harness` — a desktop
#     commit, visible in the diff. This line does NOT pin a single tree by
#     itself; do not read it as though it did.
#
# Read the `Cargo.lock` diff on every PR that touches it — that file is the review
# surface now, and the rename is the proof: four lines changed (the package name,
# its `source`, a new `checksum`, and the `archimedes` dep-list entry) with no
# graph churn, because the engine's 22 dependencies are identical between the two
# forms. A lockfile that churns beyond that means something else resolved
# differently — investigate before committing.
#
# Working on the crate alongside the desktop? Do NOT edit this line to a path
# (that would commit a dep that cannot resolve for anyone else). Copy
# `.cargo/config.toml.example` to `.cargo/config.toml` — the `[patch.crates-io]`
# there redirects the CRATES.IO source to a sibling checkout and is gitignored, so
# it can never leak into a commit. `.cargo/config.toml.example` is inert (cargo
# reads only `config.toml`), which is what makes it safe to ship.
fulcrum-harness = "0.2.0"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
# The OS notification behind an attention alert (ADR 0038) — called from Rust
# only, so there is no capability entry and no npm package.
tauri-plugin-notification = "2"
# The on-disk state dirs (`~/.config/archimedes`, `~/.local/share/archimedes`,
# `~/Library/Application Support/archimedes`, …) — the same crate Tauri uses
# to resolve the platform base dirs, joined with a bare `archimedes` (NOT
# the bundle identifier: Tauri's own `config_dir()` / `app_data_dir()`
# append the identifier, which would give `…/codes.archimedes.desktop`).
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "io-std", "sync", "macros", "time", "net", "rt"] }
tokio-util = "0.7"
# The `exec_find` fallback when `fd` is not installed (walk the cwd tree).
walkdir = "2"
# The walker `ripgrep` is built on — a LIBRARY, statically linked, so there is
# no binary for the user to install. It decides the `?` listing's visibility:
# the repo's own ignore rules are what prune it (ADR 0034), which is a
# load-bearing semantic rather than an implementation detail, so the version
# this design was verified against is recorded here: 0.4.33.
ignore = "0.4"
# base64 for the `read` tool's image content blocks (pi's `ImageContent` =
# `{type: "image", data, mimeType}` — `data` is base64, no `data:` prefix).
base64 = "0.22"
thiserror = "2"
# The native harness's model client (native-agent-harness Task 4): an
# OpenAI-compatible chat-completions client (streaming SSE). `rustls-tls`
# (default features off) avoids a system-OpenSSL build dependency;
# `stream` provides `bytes_stream`, `json` the request body.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
# `url` (already a transitive `reqwest` dep — no new crate): parsing the
# base URL's PATH for the Anthropic-wire `/v1` normalization (ADR 0024 —
# mirroring ZCode's `normalizeAnthropicBaseURL`, which operates on the
# URL path, NOT the full string, so a query string is not corrupted).
url = "2"
# `BoxStream` (the `Provider`'s returned stream) + `StreamExt` (consuming
# it in the `AgentLoop`, Task 6) — `futures-core` alone has `BoxStream`
# but no `.next()`, so the full `futures-util` is needed.
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
# OAuth 2.1 (the native `mcp` tool's HTTP-server auth, ADR 0018): `sha2`
# (the PKCE S256 challenge) + `rand` (the PKCE verifier + the callback
# `state` entropy).
sha2 = "0.10"
rand = "0.9"
async-trait = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
# System-clipboard image read for the WebKitGTK paste fallback (Wayland
# `wl-clipboard-rs` backend when `WAYLAND_DISPLAY` is set, X11 otherwise).
arboard = { version = "3.6", features = ["wayland-data-control"] }
image = { version = "0.25", features = ["png"] }
dom_query = "0.28"
ddgs = "0.1"
ipnet = "2"
pdf-extract = "0.12"
regex = "1"
# The codemode sandbox engine (ADR 0089): an embedded QuickJS in the
# Worker. `futures` exposes AsyncRuntime/AsyncContext; `parallel` is the
# crate's (experimental) gate for the Send + Sync impls the engine needs
# to live inside tokio::spawn(loop_.run()) — decided by a compile-time
# assertion, not assumption (see codemode-task02). WITHOUT `parallel` the
# assertion does not compile — `AsyncRuntime`/`AsyncContext` are `!Send +
# !Sync`, their impls are `#[cfg(feature = "parallel")]` in the crate.
# `rust-alloc`/`allocator` must stay OFF. rquickjs documents `set_memory_limit`
# as "a Noop when a custom allocator is being used, as is the case for the
# 'rust-alloc' or 'allocator' features"
# (rquickjs-core-0.14.0/src/runtime/async.rs:204-210), and this dependency is
# pinned to the version carrying that warning.
#
# The warning is stronger than what was measured here, and both halves are
# recorded so nobody re-derives it: with `--features rquickjs/rust-alloc` on this
# exact dependency set, the limit was still REPORTED (memory_usage's
# `malloc_limit` read back 8 388 608) and still ENFORCED (an 8 MiB-capped blowup
# threw with `malloc_size` plateaued at 8 387 864) — because QuickJS's cap check
# sits in `js_malloc_rt` (quickjs.c:2017), ABOVE the `rt->mf.js_malloc` allocator
# dispatch. So the no-op is not reproducible on 0.14.0. Keep the features off
# regardless: the guarantee we are relying on is the one the crate PROMISES, and
# a future rquickjs that moves the check behind the allocator dispatch makes the
# cap vanish silently.
#
# Guards, and which one catches what — a unit test CANNOT catch the graph
# poisoning, because feature unification happens at compile time, before any
# test runs:
#   - scripts/check-rquickjs-allocator.sh (CI `scripts` job) — the BUILD GRAPH:
#     asks the resolver whether either feature got unified in from a transitive
#     dependency. That is the only party that can know.
#   - engine.rs `memory_cap_is_installed_not_merely_requested` — the cap is
#     INSTALLED (reads the limit back out of the C runtime).
#   - engine.rs `a_tiny_cap_surfaces_as_a_script_end_not_a_hang` — the cap is
#     ENFORCED (an allocation above an 8 MiB cap must end as a ScriptEnd).
rquickjs = { version = "0.14.0", features = ["futures", "parallel"] }
# (Task 4) The ATOMIC settings write (`config::write_settings_atomic`):
# `NamedTempFile` in the config dir + `persist` (rename), so a torn write can
# never destroy `settings.json`. Was a DEV-dependency (test temp dirs only);
# the production use here is why it moved to `[dependencies]` — the version is
# unchanged, so the lockfile does not re-resolve. The dev-dependency entry is
# GONE (a crate listed in both is redundant; `[dependencies]` covers tests).
tempfile = "3"

[dev-dependencies]
serde_json = "1"
# Enables `tauri::test` (mock runtime) for the headless IPC test.
tauri = { version = "2", features = ["test"] }
# Mock HTTP server for the `Provider` integration tests (canned SSE
# streams, canned status codes).
wiremock = "0.6"
# `test-util` (dev-only): the paused clock the prompt tests advance well past
# any deadline they must NOT carry — a question waits for the person, never
# for a timer.
tokio = { version = "1", features = ["test-util"] }

# `libc` is needed on ALL unix platforms: `RealSudoRunner`'s
# `#[cfg(unix)]` `setpgid`/`kill` (process-group kill) code compiles on
# every unix target.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Direct GTK dependency matches tao/wry 0.18 on Linux to access
# GdkWindowState and gtk_window on the main thread; a Tauri bump must
# check the matching tao version.
gtk = "0.18"

# The session-bus send behind a Linux attention alert (`attention::delivery`).
# Version AND default features are the plugin's own (`notify-rust = "4.18"`,
# default `z`), so feature unification keeps ONE copy of the crate in the
# graph — the target list is the plugin's own notify-rust gate verbatim:
# android/ios are `unix` but are exactly what it excludes, and so are we
# (`cfg(unix)` alone would ask notify-rust to build there).
#
# `zbus` joins it because the alert is now SENT on a connection this app owns
# for the whole process (`attention::delivery::bus`), and the one signal thread
# that watches for the body click is a `zbus` subscription — `notify_rust`'s
# `show()` opens a connection per alert and hands no way to watch the bus.
# Version AND default features are again the plugin's own (`zbus = "5"`, under
# the SAME target gate in `tauri-plugin-notification` 2.6.0's manifest), and
# 5.19.0 is already resolved in `Cargo.lock` from that edge — so this line adds
# a direct edge to a crate already in the graph and compiles nothing new
# (`blocking-api`, which the `bus` code needs, is in zbus's DEFAULT features).
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
notify-rust = "4.18"
zbus = "5"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# The auto-updater behind `check_update` / `install_update` / `relaunch_app`
# (ADR 0053) — registered in Rust and called from Rust, so there is no
# capability entry and no npm package, exactly like the notification plugin
# above. Target-gated to the three desktop OSes because that is the whole set
# the plugin supports (its own manifest lists no mobile support) and this app
# ships desktop-only; `tauri` itself stays pinned at the version
# `@tauri-apps/cli` is pinned to (AGENTS.md), which 2.14 respects (`tauri = "2.12"`).
tauri-plugin-updater = "2.14.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
#
# The `[profile.release]` block that used to sit here lives in the WORKSPACE ROOT's
# `Cargo.toml` now. Cargo honours release profiles only from the root manifest of a
# workspace and warns "profiles for the non root package will be ignored" from here, so
# leaving it in the member would have made it dead configuration — and the five settings
# (including ADR 0025's `panic = "unwind"`) must keep applying exactly as before.

